<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SRMS – User Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    /* Main body with gradient background */
    body {
      background: radial-gradient(circle at top left, #0c2340 0%, #020712 55%, #000000 100%);
      color: #ffffff;
      min-height: 100vh;
    }

    /* Page container */
    .page-wrapper {
      max-width: 1200px;
      margin: 20px auto 40px;
      padding: 0 20px 40px;
    }

    /* ========== TOP ROW: LOGO | NAVBAR | ICONS ========== */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #4da3ff;
      box-shadow: 0 0 18px rgba(0, 140, 255, 0.4);
      cursor: pointer;
      transition: 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
    }

    /* Navigation bar container in the middle */
    .navbar {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 40px;
      border: 1px solid #4da3ff;
      background: rgba(7, 27, 54, 0.8);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .navbar:hover {
      box-shadow: 0 0 20px rgba(77, 163, 255, 0.3);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid #58c5ff;
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(88, 197, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(88, 197, 255, 0.4);
    }

    .nav-btn.active {
      background: #005eff;
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 140, 255, 0.7);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #58c5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      background: rgba(2, 31, 60, 0.9);
      transition: all 0.3s ease;
    }

    .icon-circle:hover {
      transform: scale(1.15);
      background: rgba(88, 197, 255, 0.3);
      box-shadow: 0 0 20px rgba(88, 197, 255, 0.6);
    }

    .profile-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: #4da3ff;
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .profile-btn:hover {
      background: #2f82e5;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(77, 163, 255, 0.5);
    }

    /* ========== MAIN CONTENT SECTION ========== */
    main {
      margin-top: 10px;
    }

    .welcome-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 20px;
    }

    .welcome-text h1 {
      font-size: 32px;
      font-weight: 600;
    }

    .create-request-btn {
      padding: 16px 28px;
      border-radius: 16px;
      border: 2px solid #7fd8c9;
      background: #4caf8a;
      color: #ffffff;
      font-weight: 600;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 180, 137, 0.45);
      transition: all 0.3s ease;
      text-decoration: none; /* for <a> */
    }

    .create-request-btn:hover {
      background: #5cc99d;
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(29, 180, 137, 0.6);
    }

    .create-request-btn span.plus {
      font-size: 24px;
      font-weight: 700;
    }

    /* ========== STATUS CARDS ========== */
    .status-cards-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 24px 0 32px;
    }

    .status-card {
      border-radius: 16px;
      padding: 28px 26px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.08);
      transition: all 0.3s ease;
      position: relative;
    }

    .status-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      border-color: rgba(255,255,255,0.2);
    }

    .status-card .icon {
      font-size: 28px;
    }

    .status-card.pending { background: #4f8edb; }
    .status-card.progress { background: #4caf8a; }
    .status-card.completed { background: #2854ff; }

    .status-card::after {
      content: 'Click to view';
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .status-card:hover::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    .status-label {
      display: block;
      font-size: 18px;
    }

    .status-count {
      display: block;
      margin-top: 4px;
      font-size: 30px;
      font-weight: 700;
    }

    /* ========== RECENT REQUESTS TABLE ========== */
    .recent-requests {
      margin-top: 16px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .recent-requests:hover {
      box-shadow: 0 16px 35px rgba(77, 158, 217, 0.4);
    }

    .recent-header {
      background: #4d9ed9;
      padding: 16px 24px;
      font-size: 22px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #08145f;
      color: #ffffff;
      font-size: 14px;
    }

    thead {
      background: #040b3a;
    }

    th, td {
      padding: 14px 24px;
      text-align: left;
    }

    tr:nth-child(even) {
      background: #071052;
    }

    tbody tr {
      transition: all 0.3s ease;
      position: relative;
    }

    tbody tr:hover {
      background: #0a1977 !important;
      box-shadow: inset 0 0 15px rgba(77, 163, 255, 0.2);
    }

    .badge {
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .badge:hover {
      transform: scale(1.1);
    }

    .badge.pending {
      background: #ffd966;
      color: #333;
    }

    .badge.resolved {
      background: #2fd38a;
      color: #022010;
    }

    .badge.progress {
      background: #a5b4fc;
      color: #111827;
    }

    /* View button in table */
    .view-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #4da3ff;
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .view-btn:hover {
      background: #4da3ff;
      color: #000;
    }

    /* ========== POPUP MODAL (DETAILS) ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, #0c2340 0%, #020712 100%);
      border: 2px solid #4da3ff;
      border-radius: 20px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 22px;
      color: #4da3ff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .close-btn:hover {
      color: #ff4444;
      transform: scale(1.15);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 18px;
      margin-top: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 13px;
      opacity: 0.85;
    }

    .field input,
    .field textarea {
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      background: #ffffff;
      color: #000;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input[readonly],
    textarea[readonly] {
      background: #e9edf6;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .status-row .label {
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-outline {
      background: transparent;
      border-color: #4da3ff;
      color: #ffffff;
    }

    .btn-primary {
      background: #005eff;
      color: #ffffff;
    }

    .btn-danger {
      background: #ff4b4b;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ========== RESPONSIVE DESIGN ========== */
    @media (max-width: 900px) {
      .top-row {
        flex-direction: column;
        align-items: stretch;
      }
      .navbar {
        order: 2;
      }
      .logo-area,
      .nav-right {
        justify-content: center;
      }
      .welcome-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .status-cards-row {
        grid-template-columns: 1fr;
      }
      .modal-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- TOP ROW: Logo | Navbar | Icons -->
    <div class="top-row">
      <!-- LEFT: Logo -->
      <div class="logo-area">
        <!-- use your logo file name here -->
        <img src="subject.png" alt="SRMS Logo" class="logo-img">
      </div>

      <!-- MIDDLE: pill navbar -->
      <header class="navbar">
        <nav class="nav-links">
          <button class="nav-btn active">Home</button>
          <button class="nav-btn">Features</button>
          <button class="nav-btn">Contact</button>
          <button class="nav-btn">Login/Sign up</button>
          <button class="nav-btn">Staff</button>
          <button class="nav-btn">Manager</button>
        </nav>
      </header>

      <!-- RIGHT: icons + update profile -->
      <div class="nav-right">
        <div class="icon-circle">✉️</div>
        <div class="icon-circle">🔔</div>
        <div class="icon-circle">👤</div>
        <button class="profile-btn">Update Profile</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main>
      <section class="welcome-row">
        <div class="welcome-text">
          <h1>Welcome …</h1>
        </div>

        <!-- link to your request form page -->
        <a href="request_page.html" class="create-request-btn">
          <span class="plus">+</span>
          <span>Create New Request</span>
        </a>
      </section>

      <!-- STATUS CARDS -->
      <section class="status-cards-row">
        <div class="status-card pending">
          <span class="icon">⏱</span>
          <div>
            <span class="status-label">Pending</span>
            <span class="status-count" id="pendingCount">0</span>
          </div>
        </div>

        <div class="status-card progress">
          <span class="icon">📋</span>
          <div>
            <span class="status-label">In progress</span>
            <span class="status-count" id="inProgressCount">0</span>
          </div>
        </div>

        <div class="status-card completed">
          <span class="icon">✔️</span>
          <div>
            <span class="status-label">Completed</span>
            <span class="status-count" id="completedCount">0</span>
          </div>
        </div>
      </section>

      <!-- RECENT REQUESTS TABLE -->
      <section class="recent-requests">
        <div class="recent-header">
          Recent Requests
        </div>
        <table>
          <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
          </thead>
          <tbody>
          <!-- rows will be inserted by JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- POPUP MODAL (view / edit request) -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>View Request</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <form id="detailsForm">
        <div class="modal-grid">
          <div class="field">
            <label for="modalTitleInput">Title</label>
            <input id="modalTitleInput" type="text" readonly>
          </div>
          <div class="field">
            <label for="modalDateInput">Date</label>
            <input id="modalDateInput" type="text" readonly>
          </div>
          <div class="field">
            <label for="modalStatusInput">Status</label>
            <input id="modalStatusInput" type="text" readonly>
          </div>
          <div class="field full">
            <label for="modalDescriptionInput">Description</label>
            <textarea id="modalDescriptionInput" readonly></textarea>
          </div>
        </div>

        <div class="status-row">
          <span class="label">Current status:</span>
          <span id="modalStatusBadge" class="badge pending">Pending</span>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="editBtn">Update</button>
          <button type="button" class="btn btn-primary" id="saveBtn" disabled>Save Changes</button>
          <button type="button" class="btn btn-danger" id="closeRequestBtn">Close Request</button>
        </div>
      </form>
    </div>
  </div>

  <!-- STORAGE JS (your coworker's file) -->
  <script src="local-storage.js"></script>

  <!-- PAGE LOGIC -->
  <script>
    // Helper to map status to badge class
    function mapStatusToBadgeClass(status) {
      const s = (status || "").toLowerCase();
      if (s === "resolved" || s === "closed" || s === "completed") return "resolved";
      if (s === "in progress" || s === "in-progress") return "progress";
      return "pending";
    }

    // Update the 3 big cards
    function updateStatusCards() {
      const requests = getAllRequests();
      let pending = 0, progress = 0, completed = 0;

      requests.forEach(r => {
        const s = (r.status || "").toLowerCase();
        if (s === "in progress" || s === "in-progress") {
          progress++;
        } else if (s === "resolved" || s === "closed" || s === "completed") {
          completed++;
        } else {
          pending++;
        }
      });

      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("inProgressCount").textContent = progress;
      document.getElementById("completedCount").textContent = completed;
    }

    // MODAL ELEMENTS
    const modal = document.getElementById("modal");
    const closeModalBtn = document.getElementById("closeModalBtn");

    const titleInput = document.getElementById("modalTitleInput");
    const dateInput = document.getElementById("modalDateInput");
    const statusInput = document.getElementById("modalStatusInput");
    const descInput = document.getElementById("modalDescriptionInput");
    const statusBadge = document.getElementById("modalStatusBadge");

    const editBtn = document.getElementById("editBtn");
    const saveBtn = document.getElementById("saveBtn");
    const closeRequestBtn = document.getElementById("closeRequestBtn");

    let activeRow = null;
    let activeRequestId = null;

    function openModalForRow(row) {
      activeRow = row;
      activeRequestId = row.dataset.id ? Number(row.dataset.id) : null;

      titleInput.value = row.dataset.title || "";
      dateInput.value = row.dataset.date || "";
      statusInput.value = row.dataset.status || "";
      descInput.value = row.dataset.description || "";

      const badgeClass = mapStatusToBadgeClass(row.dataset.status);
      statusBadge.textContent = row.dataset.status || "Pending";
      statusBadge.classList.remove("pending", "resolved", "progress");
      statusBadge.classList.add(badgeClass);

      [titleInput, dateInput, statusInput, descInput].forEach(f => f.readOnly = true);
      saveBtn.disabled = true;
      editBtn.disabled = false;

      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
      activeRow = null;
      activeRequestId = null;
    }

    closeModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // Enable editing
    editBtn.addEventListener("click", () => {
      [titleInput, dateInput, statusInput, descInput].forEach(f => f.readOnly = false);
      saveBtn.disabled = false;
      editBtn.disabled = true;
    });

    // Save changes
    saveBtn.addEventListener("click", () => {
      if (!activeRow) return;

      // Update row dataset & UI
      activeRow.dataset.title = titleInput.value;
      activeRow.dataset.date = dateInput.value;
      activeRow.dataset.status = statusInput.value;
      activeRow.dataset.description = descInput.value;

      activeRow.children[0].textContent = titleInput.value;
      activeRow.children[2].textContent = dateInput.value;

      const badgeSpan = activeRow.querySelector(".badge");
      const newBadgeClass = mapStatusToBadgeClass(statusInput.value);
      badgeSpan.textContent = statusInput.value;
      badgeSpan.classList.remove("pending", "resolved", "progress");
      badgeSpan.classList.add(newBadgeClass);

      // Update in localStorage
      if (activeRequestId != null) {
        const req = getRequestById(activeRequestId);
        if (req) {
          req.subject = titleInput.value;
          req.status = statusInput.value;
          req.description = descInput.value;
          updateRequest(req);
        }
      }

      [titleInput, dateInput, statusInput, descInput].forEach(f => f.readOnly = true);
      saveBtn.disabled = true;
      editBtn.disabled = false;

      updateStatusCards();
      closeModal();
    });

    // Close / resolve request
    closeRequestBtn.addEventListener("click", () => {
      if (!activeRow) return;

      const resolvedText = "Resolved";

      statusInput.value = resolvedText;
      statusBadge.textContent = resolvedText;
      statusBadge.classList.remove("pending", "progress");
      statusBadge.classList.add("resolved");

      const badgeSpan = activeRow.querySelector(".badge");
      badgeSpan.textContent = resolvedText;
      badgeSpan.classList.remove("pending", "progress");
      badgeSpan.classList.add("resolved");

      activeRow.dataset.status = resolvedText;

      // Update in localStorage
      if (activeRequestId != null) {
        const req = getRequestById(activeRequestId);
        if (req) {
          req.status = resolvedText;
          updateRequest(req);
        }
      }

      updateStatusCards();
      closeModal();
    });

    // Build table from localStorage
    window.addEventListener("DOMContentLoaded", () => {
      const tbody = document.querySelector("tbody");
      tbody.innerHTML = "";

      const requests = getAllRequests();

      requests.forEach(req => {
        const tr = document.createElement("tr");
        const title = req.subject || "";
        const status = req.status || "Pending";
        const dateStr = req.createdAt
          ? new Date(req.createdAt).toLocaleDateString()
          : "";

        tr.dataset.id = req.id;
        tr.dataset.title = title;
        tr.dataset.status = status;
        tr.dataset.description = req.description || "";
        tr.dataset.date = dateStr;

        const badgeClass = mapStatusToBadgeClass(status);

        tr.innerHTML = `
          <td>${title}</td>
          <td><span class="badge ${badgeClass}">${status}</span></td>
          <td>${dateStr}</td>
          <td><button class="view-btn">View Request</button></td>
        `;

        const btn = tr.querySelector(".view-btn");
        btn.addEventListener("click", () => openModalForRow(tr));

        tbody.appendChild(tr);
      });

      updateStatusCards();
    });
  </script>
</body>
</html>
