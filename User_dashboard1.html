<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Syne', Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: transparent;
            margin-bottom: 40px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0099ff, #00ffff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            box-shadow: 0 0 40px rgba(0, 153, 255, 0.6);
            border: 3px solid #0099ff;
        }

        .nav-menu {
            display: flex;
            gap: 0;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            padding: 8px;
            border: 2px solid #0099ff;
            box-shadow: 0 0 30px rgba(0, 153, 255, 0.3);
        }

        .nav-item {
            padding: 15px 35px;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s;
            font-size: 18px;
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(0, 153, 255, 0.2);
        }

        .nav-item.active {
            background: #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.6);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #0099ff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(0, 153, 255, 0.4);
        }

        .icon-btn:hover {
            background: rgba(0, 153, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 153, 255, 0.6);
        }

        .update-profile-btn {
            padding: 15px 40px;
            background: #00aaff;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: 15px;
            box-shadow: 0 5px 20px rgba(0, 170, 255, 0.3);
        }

        .update-profile-btn:hover {
            background: #0088cc;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 170, 255, 0.5);
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .welcome {
            font-size: 42px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .create-request-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 18px 35px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 28px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(0, 184, 148, 0.3);
        }

        .create-request-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.5);
        }

        .create-request-btn::before {
            content: '+';
            font-size: 35px;
            font-weight: bold;
        }

        /* Status Cards */
        .status-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        .status-card {
            padding: 50px 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 32px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .status-card.pending {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .status-card.in-progress {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .status-card.completed {
            background: linear-gradient(135deg, #0066ff, #0052cc);
        }

        .status-icon {
            font-size: 50px;
        }

        /* Recent Requests Table */
        .recent-requests {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .table-header {
            padding: 30px 40px;
            font-size: 32px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #0052cc;
        }

        th {
            padding: 25px 40px;
            text-align: left;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        tbody tr {
            background: #0052cc;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 25px 40px;
            font-size: 18px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
        }

        .status-badge.pending {
            background: #ffa500;
            color: #000;
        }

        .status-badge.resolved {
            background: #00cec9;
            color: #000;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .status-cards {
                grid-template-columns: 1fr;
            }

            .nav-menu {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">S</div>
            <div class="nav-menu">
                <a href="#" class="nav-item active">Home</a>
                <a href="#" class="nav-item">Features</a>
                <a href="#" class="nav-item">Contact</a>
                <a href="#" class="nav-item">Login/sign up</a>
                <a href="#" class="nav-item">Staff</a>
                <a href="#" class="nav-item">Manager</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="icon-btn">✉️</div>
            <div class="icon-btn">🔔</div>
            <div class="icon-btn">👤</div>
            <button class="update-profile-btn">Update Profile</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1 class="welcome">Welcome ...</h1>

        <button class="create-request-btn">Create New Request</button>

        <!-- Status Cards -->
        <div class="status-cards">
            <div class="status-card pending">
                <span class="status-icon">🕐</span>
                <span>Pending</span>
            </div>
            <div class="status-card in-progress">
                <span class="status-icon">📋</span>
                <span>In progress</span>
            </div>
            <div class="status-card completed">
                <span class="status-icon">✓</span>
                <span>Completed</span>
            </div>
        </div>

        <!-- Recent Requests Table -->
        <div class="recent-requests">
            <div class="table-header">Recent Requests</div>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Laptop Repair</td>
                        <td><span class="status-badge pending">Pending</span></td>
                        <td>11/4/2025</td>
                    </tr>
                    <tr>
                        <td>Software installation</td>
                        <td><span class="status-badge resolved">Resolved</span></td>
                        <td>11/4/2024</td>
                    </tr>
                    <tr>
                        <td>Request For Office Supplies</td>
                        <td><span class="status-badge resolved">Resolved</span></td>
                        <td>11/4/2023</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Add click handlers
        document.querySelector('.create-request-btn').addEventListener('click', function() {
            alert('Create New Request clicked!');
            // Here you would navigate to the request creation page
        });

        document.querySelectorAll('.status-card').forEach(card => {
            card.addEventListener('click', function() {
                const status = this.classList[1];
                alert(`Viewing ${status} requests`);
                // Here you would filter/show requests by status
            });
        });

        document.querySelector('.update-profile-btn').addEventListener('click', function() {
            alert('Update Profile clicked!');
            // Here you would navigate to profile page
        });
    </script>
</body>
</html>
