<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Request Form – SRMS</title>

  <!-- Syne font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========== BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Syne", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #0c2340 0%, #020712 55%, #000000 100%);
      color: #f9fafb;
      min-height: 100vh;
    }

    .page-wrapper {
      max-width: 1200px;
      margin: 20px auto 40px;
      padding: 0 20px 40px;
    }

    /* ========== TOP ROW (logo + navbar + icons) ========== */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
      padding: 12px 24px;
      border-radius: 50px;
      
      
    }

    /* LEFT LOGO */
    .logo-area {
      display: flex;
      align-items: center;
    }

    .logo-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4da3ff;
      box-shadow: 0 0 18px rgba(0, 140, 255, 0.4);
    }

    /* MIDDLE NAV PILL */
    
    
    .nav-pill {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid #4da3ff;
      
    }

    .nav-btn {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid #58c5ff;
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(88, 197, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(88, 197, 255, 0.4);
    }

    .nav-btn.active {
      background: #005eff;
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 140, 255, 0.7);
    }

    /* RIGHT ICONS + PROFILE BUTTON */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #58c5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 31, 60, 0.9);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .icon-circle:hover {
      transform: scale(1.12);
      background: rgba(88, 197, 255, 0.3);
      box-shadow: 0 0 20px rgba(88, 197, 255, 0.6);
    }

    .profile-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: #4da3ff;
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .profile-btn:hover {
      background: #2f82e5;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(77, 163, 255, 0.5);
    }

    /* ========== LAYOUT ========== */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 40px;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ========== FORM (match login spacing & inputs) ========== */
    .form-container {
      padding: 24px 8px;
      max-width: 550px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .description {
      font-size: 14px;
      color: #e5e7eb;
      margin-bottom: 20px;
    }

    form {
      margin-top: 4px;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }

    .wide {
      margin-bottom: 18px;
    }

    label {
      margin-bottom: 6px;
      font-size: 13px;
      display: block;
      opacity: 0.9;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 14px;
      background: rgba(15, 23, 42, 0.9);
      color: #f9fafb;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #6b7280;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.6);
      background: rgba(15, 23, 42, 1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      margin-top: 10px;
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      color: #f9fafb;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.45);
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
    }

    .submit-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(59, 130, 246, 0.55);
    }

    .submit-btn:active {
      transform: translateY(1px);
      box-shadow: 0 6px 12px rgba(59, 130, 246, 0.38);
    }

    /* ========== RIGHT SIDE IMAGE (RequestForm.png) ========== */
    .right-bg {
      border-radius: 20px;
      overflow: hidden;
      background: radial-gradient(circle at 10% 0%, #1d4ed8, #020617 60%);
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    }

    .right-bg-inner {
      height: 100%;
      min-height: 420px;
      background-image: url('RequestForm.png'); /* your second image */
      background-size: cover;
      background-position: center;
      border-radius: 14px;
    }

  </style>
</head>

<body>
  <div class="page-wrapper">

    <!-- TOP NAV ROW (matches dashboard) -->
    <div class="top-row">

      <!-- LEFT: Logo -->
      <div class="logo-area">
        <img src="subject.png" alt="SRMS Logo" class="logo-img">
      </div>

      <!-- MIDDLE: Nav pill -->
      <header class="navbar">
        <nav class="nav-pill">
          <button class="nav-btn active">Home</button>
          <button class="nav-btn">Features</button>
          <button class="nav-btn">Contact</button>
          <button class="nav-btn">Login/Sign up</button>
          <button class="nav-btn">Staff</button>
          <button class="nav-btn">Manager</button>
        </nav>
      </header>

      <!-- RIGHT: Icons + Update Profile -->
      <div class="nav-right">
        <div class="icon-circle">✉️</div>
        <div class="icon-circle">🔔</div>
        <div class="icon-circle">👤</div>
        <button class="profile-btn">Update Profile</button>
      </div>
    </div>

    <div class="content-grid">
      <!-- FORM -->
      <div class="form-container">
        <h1>Request Form</h1>
        <p class="description">Please fill out the form below to request support or report an issue.</p>

        <form id="requestForm">
          <div class="form-row">
            <div style="flex: 1;">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" placeholder="First Name" required>
            </div>
            <div style="flex: 1;">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" placeholder="Last Name" required>
            </div>
          </div>

          <div class="form-row">
            <div style="flex: 1;">
              <label for="category">Category</label>
              <input type="text" id="category" placeholder="Category">
            </div>
            <div style="flex: 1;">
              <label for="priority">Priority</label>
              <input type="text" id="priority" placeholder="Priority">
            </div>
          </div>

          <div class="wide">
            <label for="subject">Subject</label>
            <input id="subject" type="text" placeholder="Subject" required>
          </div>

          <div class="wide">
            <label for="description">Description</label>
            <textarea id="description" placeholder="Describe your issue..."></textarea>
          </div>

          <button type="submit" class="submit-btn">Submit Request</button>
        </form>
      </div>

      <!-- RIGHT HERO PANEL -->
      <div class="right-bg">
        <div class="right-bg-inner"></div>
      </div>
    </div>
  </div>

  <!-- SCRIPT (same logic) -->
  <script src="local-storage.js"></script>

<script>
document.getElementById("requestForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        email: "placeholder@example.com", // You can add a real email field later
        category: document.getElementById("category").value,
        priority: document.getElementById("priority").value,
        subject: document.getElementById("subject").value,
        description: document.getElementById("description").value
    };

    const newId = saveRequest(data);

    window.location.href = "user_dashboard2.html";
});
</script>


</body>
</html>
