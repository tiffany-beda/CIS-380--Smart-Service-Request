<!DOCTYPE html>
<title\>Smart Service Request Management System</title\>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Syne font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---- Base ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Syne", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      min-height: 100vh;
      color: #f9fafb; /* main text = white */
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #020617; /* dark navy */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;


      
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ---- Layout ---- */
    .wrapper {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .top-logo {
      display: flex;
      align-items: center;
      margin-bottom: -60px;
    }

    .logo-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 32px;
      color: #e5e7eb;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 40px;
      align-items: center;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        margin-top: 32px;
      }
    }

    /* ---- Left: form ---- */
    .headline {
      margin-bottom: 24px;
    }

    .headline h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .headline p {
      font-size: 14px;
      color: #e5e7eb; /* light text, not gray-gray */
    }

    form {
      margin-top: 12px;
    }

    .field-group {
      margin-bottom: 18px;
    }

    .field-label {
      font-size: 13px;
      margin-bottom: 6px;
      display: block;
      color: #f9fafb;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .field-input::placeholder {
      color: #6b7280;
    }

    .field-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.6);
      background: rgba(15, 23, 42, 1);
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
      margin-bottom: 18px;
      font-size: 12px;
      color: #e5e7eb;
    }

    .primary-btn {
      width: 100%;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: #f9fafb;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.45);
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
    }

    .primary-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(59, 130, 246, 0.55);
    }

    .primary-btn:active {
      transform: translateY(1px);
      box-shadow: 0 6px 12px rgba(59, 130, 246, 0.38);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      font-size: 12px;
      color: #e5e7eb;
    }

    .divider-line {
      height: 1px;
      flex: 1;
      background: linear-gradient(
        to right,
        rgba(148, 163, 184, 0),
        rgba(148, 163, 184, 0.7),
        rgba(148, 163, 184, 0)
      );
    }

    .divider span {
      margin: 0 10px;
    }

    .social-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .social-btn {
      flex: 1 1 0px;
      min-width: 80px;
      border-radius: 8px;
      padding: 10px 0;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border 0.15s;
      color: #f9fafb;          /* <-- text + icon color */
    }

    .social-btn span.icon {
      font-size: 16px;
      color: #f9fafb;          /* <-- make icons white */
    }

    .social-btn:hover {
      background: rgba(30, 64, 175, 0.35);
      border-color: #60a5fa;
    }

    .bottom-text {
      font-size: 13px;
      color: #e5e7eb;
    }

    .bottom-text a {
      font-weight: 600;
    }

    /* ---- Right: hero image ---- */
    .hero {
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at 10% 0%, #1d4ed8, #020617 60%);
      padding: 12px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.9);
    }
    .top-logo-img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #38bdf8;
  box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
}


    .hero img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Logo -->
    <div class="top-logo">
      <img src="Frame 85.png" class="top-logo-img" alt="SRMS Logo">

    </div>

    <div class="grid">
      <!-- Left: login form -->
      <div>
        <div class="headline">
          <h1>Log into your account.</h1>
          <p>Enter your email address and password to log in.</p>
        </div>

        <form action="user_dashboard2.html" method="get">

          <div class="field-group">
            <label class="field-label" for="email">Email</label>
            <input
              class="field-input"
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <input
              class="field-input"
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="forgot-row">
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn">Sign in</button>
        </form>

        <div class="divider">
          <div class="divider-line"></div>
          <span>or</span>
          <div class="divider-line"></div>
        </div>

        <div class="social-row">
          <button class="social-btn" type="button">
            <span class="icon">📧</span>
            <span>Google</span>
          </button>

          <button class="social-btn" type="button">
            <span class="icon"></span>
            <span>Apple</span>
          </button>

          <button class="social-btn" type="button">
            <span class="icon">f</span>
            <span>Facebook</span>
          </button>
        </div>

        <p class="bottom-text">
          Don’t have an account?
          <a href="#">Sign up</a>
        </p>
      </div>

      <!-- Right: hero image -->
      <div class="hero">
        <!-- Replace src with your image path -->
        <img
          src="log_in_pic.png"
          alt="Abstract glass illustration"
        />
      </div>
    </div>
  </div>
</body>
</html>
